# The musl targets are self-contained (Rust ships their crt objects and libc),
# so the only thing a cross-build needs from the host is a linker that emits
# ELF. rust-lld ships with the toolchain and rustc finds it on any host.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
