[package]
name = "caliper-engine"
description = "Probe engine: fork isolation, verdict classification, side-effect accounting, attribution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
libc.workspace = true
nix = { workspace = true, features = ["process", "signal"] }
serde.workspace = true

[dev-dependencies]
libc.workspace = true
# §10: seccompiler for filter construction in test fixtures.
seccompiler = "0.4"
serde_json.workspace = true

# Runs its own single-threaded main; see the file for why.
[[test]]
name = "panic"
harness = false

# Likewise: seccomp filters are per thread and permanent, and the test
# needs a thread left unfiltered to clean up with.
[[test]]
name = "janitor"
harness = false
