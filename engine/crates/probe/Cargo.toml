[package]
name = "caliper-probe"
description = "The binary that ships in the probe image"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "caliper-probe"
path = "src/main.rs"

[dependencies]
caliper-engine = { path = "../engine" }
caliper-corpus = { path = "../corpus" }
serde_json.workspace = true

[dev-dependencies]
libc.workspace = true
# §10: seccompiler for filter construction in test fixtures.
seccompiler = { version = "0.4", features = ["json"] }
