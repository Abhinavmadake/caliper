name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job here checks out, builds and tests. None writes to the repository,
# so the token is read-only regardless of the repository default, which is a
# setting that can change without this file changing with it.
permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
      - name: validate reference posture
        run: |
          python3 - <<'PY'
          import json
          import yaml

          with open("posture/v1/posture.yaml") as f:
              posture = yaml.safe_load(f)
          with open("corpus/index.json") as f:
              corpus = json.load(f)

          assert posture["posture_revision"] == "v1"
          assert posture["status"] == "released"
          assert {tier["name"] for tier in posture["tiers"]} == {
              "privileged", "baseline", "restricted", "untrusted-multi-tenant"
          }
          probes_by_family = {}
          for probe in corpus:
              probes_by_family.setdefault(probe["family"], set()).add(probe["id"])
          measured_families = set(probes_by_family)
          deferred_families = {
              # The nine families specified by issue #20.  They are deliberately
              # kept separate from the measured corpus until implementation work
              # promotes them into the committed set.
              "ioctl",
              "bpf",
              "keyctl",
              "prctl",
              "perf_event_open",
              "userfaultfd",
              "open_by_handle_at",
              "module_loading",
              "seccomp_user_notification",
          }
          assert measured_families.isdisjoint(deferred_families)
          for assertion in posture["assertions"]:
              assert assertion["family"] in measured_families | deferred_families
              assert assertion["expect"] == "unreachable"
              assert assertion["rationale"].strip()
              assert assertion["citations"]
              assert all(citation.get("id") or citation.get("url")
                         for citation in assertion["citations"])
              # A misspelled singular ``probe_id`` is not allowed to fall back
              # to the family-wide assertion semantics of an omitted list.
              assert "probe_id" not in assertion
              assert set(assertion) <= {
                  "tier", "family", "probe_ids", "expect", "rationale",
                  "citations",
              }
              if "probe_ids" in assertion:
                  assert isinstance(assertion["probe_ids"], list)
                  assert assertion["probe_ids"]
                  assert len(assertion["probe_ids"]) == len(set(assertion["probe_ids"]))
                  assert all(
                      probe_id in probes_by_family[assertion["family"]]
                      for probe_id in assertion["probe_ids"]
                  )
          PY
          test -f posture/CHANGELOG.md
          grep -q '^## v1 — released — ' posture/CHANGELOG.md
      - name: validate k8s manifests
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz
          ./kubeconform -strict deploy/k8s/

  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel and installs the musl targets.
      # Tests run on the musl target too: the seccomp allowlist test execs
      # the probe binary, and the allowlist is a property of the musl build.
      - name: build and test (static musl)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --locked
          cargo test --target x86_64-unknown-linux-musl --locked
          cargo clippy --all-targets --target x86_64-unknown-linux-musl --locked -- -D warnings
          cargo fmt --check
      # The checked-in corpus index is the W8 freeze artefact (#19). Any
      # probe/status/metadata change must update it in the same reviewed PR.
      - name: frozen corpus index
        run: |
          target/x86_64-unknown-linux-musl/release/caliper-probe --dump-corpus | diff -u - ../corpus/index.json
      - name: no dynamic loader
        run: |
          bin=target/x86_64-unknown-linux-musl/release/caliper-probe
          file "$bin"
          if readelf -lW "$bin" | grep -q INTERP; then echo "has PT_INTERP"; exit 1; fi
      # The engine's own syscall footprint must not drift without the
      # baseline being updated deliberately (issue #4).
      - name: syscall baseline
        run: |
          sudo apt-get install -y -qq strace
          scripts/baseline-syscalls.sh target/x86_64-unknown-linux-musl/release/caliper-probe > /tmp/observed
          grep -v '^#' baseline/x86_64.txt | diff -u - /tmp/observed
      - name: probe image from scratch
        run: |
          docker build -t caliper-probe .
          docker run --rm caliper-probe --noop
          docker run --rm --security-opt seccomp=fixtures/seccomp/hardened.json caliper-probe --noop
          docker run --rm caliper-probe --run > /dev/null
          docker run --rm --security-opt seccomp=fixtures/seccomp/hardened.json caliper-probe --run > /dev/null
      - name: verify alert-safe reduced corpus
        run: |
          ../scripts/test-alert-safe.sh

  control:
    # Activates once control/go.mod exists (week 2, issue #3).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build, vet and test
        run: |
          if [ ! -f control/go.mod ]; then echo "control/ not started yet"; exit 0; fi
          cd control && go build ./... && go vet ./... && go test ./...
