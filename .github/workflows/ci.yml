name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

  engine:
    # Activates once engine/Cargo.toml exists (week 1, issue #4).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build and test
        run: |
          if [ ! -f engine/Cargo.toml ]; then echo "engine/ not started yet"; exit 0; fi
          rustup target add x86_64-unknown-linux-musl
          cd engine && cargo build --target x86_64-unknown-linux-musl --locked && cargo test --locked

  control:
    # Activates once control/go.mod exists (week 2, issue #3).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build, vet and test
        run: |
          if [ ! -f control/go.mod ]; then echo "control/ not started yet"; exit 0; fi
          cd control && go build ./... && go vet ./... && go test ./...
