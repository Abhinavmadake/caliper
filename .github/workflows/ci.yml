name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job here checks out, builds and tests. None writes to the repository,
# so the token is read-only regardless of the repository default, which is a
# setting that can change without this file changing with it.
permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel and installs the musl targets.
      # Tests run on the musl target too: the seccomp allowlist test execs
      # the probe binary, and the allowlist is a property of the musl build.
      - name: build and test (static musl)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --locked
          cargo test --target x86_64-unknown-linux-musl --locked
          cargo clippy --all-targets --target x86_64-unknown-linux-musl --locked -- -D warnings
          cargo fmt --check
      - name: no dynamic loader
        run: |
          bin=target/x86_64-unknown-linux-musl/release/caliper-probe
          file "$bin"
          if readelf -lW "$bin" | grep -q INTERP; then echo "has PT_INTERP"; exit 1; fi
      # The engine's own syscall footprint must not drift without the
      # baseline being updated deliberately (issue #4).
      - name: syscall baseline
        run: |
          sudo apt-get install -y -qq strace
          scripts/baseline-syscalls.sh target/x86_64-unknown-linux-musl/release/caliper-probe > /tmp/observed
          grep -v '^#' baseline/x86_64.txt | diff -u - /tmp/observed
      - name: probe image from scratch
        run: |
          docker build -t caliper-probe .
          docker run --rm caliper-probe --noop
          docker run --rm --security-opt seccomp=fixtures/seccomp/hardened.json caliper-probe --noop
          docker run --rm caliper-probe --run > /dev/null
          docker run --rm --security-opt seccomp=fixtures/seccomp/hardened.json caliper-probe --run > /dev/null

  control:
    # Activates once control/go.mod exists (week 2, issue #3).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build, vet and test
        run: |
          if [ ! -f control/go.mod ]; then echo "control/ not started yet"; exit 0; fi
          cd control && go build ./... && go vet ./... && go test ./...
