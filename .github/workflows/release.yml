# A release (#50): the probe image for both architectures, built natively
# from the tag and signed keylessly with cosign, and a GitHub release that
# carries the reference posture and the corpus index beside it. Verifying the
# signature is in RELEASE.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: build and push the ${{ matrix.arch }} image
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:${TAG}-${ARCH}"
          docker buildx build --pull --platform "linux/$ARCH" --push -t "$image" engine/
          docker run --rm "$image" --noop

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: join the architectures and sign
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          base="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create -t "$base:$TAG" "$base:$TAG-amd64" "$base:$TAG-arm64"
          digest=$(docker buildx imagetools inspect "$base:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$base@$digest"
          echo "IMAGE=$base@$digest" >> "$GITHUB_ENV"
      - name: GitHub release with the reference posture and corpus
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          revision=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/crates/corpus/Cargo.toml)
          cp posture/v1/posture.yaml posture-v1.yaml
          cp posture/v1/RATIONALE.md posture-v1-rationale.md
          cp corpus/index.json "corpus-$revision.json"
          cat > notes.md <<EOF
          Probe image: \`$IMAGE\` (linux/amd64, linux/arm64), corpus revision $revision, fingerprint format 1, reference posture v1.

          Verify the image's signature as in [RELEASE.md](https://github.com/$REPOSITORY/blob/$TAG/RELEASE.md) before running it.

          CALIPER measures and reports; it does not enforce. Run it only on infrastructure you own or have written authorisation to test.
          EOF
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            posture-v1.yaml posture-v1-rationale.md "corpus-$revision.json"
