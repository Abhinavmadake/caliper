# Cell 3: amd64, Fedora, containerd 2.2 and runc, SELinux
minimumLimaVersion: "1.0.0"
vmType: "qemu"

images:
  - location: "https://download.fedoraproject.org/pub/fedora/linux/releases/41/Cloud/x86_64/images/Fedora-Cloud-Base-Generic.x86_64-41-1.4.qcow2"
    arch: "x86_64"

cpus: 4
memory: "4GiB"
disk: "30GiB"

mounts:
  - location: "~/caliper"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      dnf install -y 'containerd = 2.2.*' runc
      
      containerd config default > /etc/containerd/config.toml
      sed -i 's/enable_selinux = false/enable_selinux = true/' /etc/containerd/config.toml
      
      systemctl enable --now containerd
      getenforce | grep -q Enforcing || setenforce 1
      
      containerd --version
      runc --version
      getenforce
