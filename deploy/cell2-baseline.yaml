#
# Cell 2, the baseline of proposal §11.1: amd64, Ubuntu 24.04 fully updated,
# containerd 2.2.1 and runc from noble-updates, AppArmor. Everything else in
# the matrix is diffed against this.
#
#   limactl start --name caliper-cell2 deploy/cell2-baseline.yaml
#   limactl snapshot create caliper-cell2 --tag clean

minimumLimaVersion: "1.0.0"
vmType: "qemu"

images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

cpus: 4
memory: "4GiB"
disk: "30GiB"

mounts:
  - location: "~/caliper"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      apt-get install -y -q \
        containerd=2.2.1-0ubuntu1~24.04.3 \
        runc=1.3.4-0ubuntu1~24.04.1 \
        apparmor
      apt-mark hold containerd runc
      systemctl enable --now containerd
      containerd --version   # containerd github.com/containerd/containerd/v2 v2.2.1 ...
      runc --version
      aa-status --enabled
