# Cell 5: amd64, Ubuntu 24.04, containerd 2.2, gVisor RuntimeClass
minimumLimaVersion: "1.0.0"
vmType: "qemu"

images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

cpus: 4
memory: "4GiB"
disk: "30GiB"

mounts:
  - location: "~/caliper"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      apt-get install -y -q \
        containerd=2.2.1-0ubuntu1~24.04.3 \
        runc=1.3.4-0ubuntu1~24.04.1 \
        apparmor curl gnupg
      apt-mark hold containerd runc
      
      curl -fsSL https://gvisor.dev/archive.key | gpg --yes --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | tee /etc/apt/sources.list.d/gvisor.list
      apt-get update -q
      apt-get install -y -q runsc
      
      containerd config default > /etc/containerd/config.toml
      sed -i 's/\[plugins."io.containerd.cri.v1.runtime".containerd.runtimes\]/\[plugins."io.containerd.cri.v1.runtime".containerd.runtimes\]\n        \[plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runsc\]\n          runtime_type = "io.containerd.runsc.v1"/' /etc/containerd/config.toml
      
      systemctl enable --now containerd
      systemctl restart containerd
      
      containerd --version
      runc --version
      runsc --version
      aa-status --enabled
