apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: caliper-probe
  labels:
    app: caliper-probe
spec:
  selector:
    matchLabels:
      app: caliper-probe
  template:
    metadata:
      labels:
        app: caliper-probe
    spec:
      automountServiceAccountToken: false
      # A DaemonSet requires restartPolicy: Always. Running the probe as an
      # init container lets it finish once, while the pause container keeps
      # the pod alive without re-running the measurement.
      initContainers:
      - name: probe
        image: caliper-probe
        imagePullPolicy: IfNotPresent
        args: ["--run"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
      volumes:
      - name: tmp
        emptyDir: {}
