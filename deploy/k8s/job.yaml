apiVersion: batch/v1
kind: Job
metadata:
  name: caliper-probe
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - name: probe
        image: caliper-probe
        imagePullPolicy: IfNotPresent
        args: ["--run"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Never
