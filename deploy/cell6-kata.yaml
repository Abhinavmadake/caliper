# Cell 6: amd64, Ubuntu 24.04, containerd 2.2, Kata Containers RuntimeClass
minimumLimaVersion: "1.0.0"
vmType: "qemu"

images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

cpus: 4
memory: "4GiB"
disk: "30GiB"

mounts:
  - location: "~/caliper"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      apt-get install -y -q \
        containerd=2.2.1-0ubuntu1~24.04.3 \
        runc=1.3.4-0ubuntu1~24.04.1 \
        apparmor curl xz-utils
      apt-mark hold containerd runc
      
      # install kata from static release
      curl -sL https://github.com/kata-containers/kata-containers/releases/download/3.7.0/kata-static-3.7.0-x86_64.tar.xz | tar -xJ -C /
      ln -sf /opt/kata/bin/containerd-shim-kata-v2 /usr/local/bin/
      
      containerd config default > /etc/containerd/config.toml
      sed -i 's/\[plugins."io.containerd.cri.v1.runtime".containerd.runtimes\]/\[plugins."io.containerd.cri.v1.runtime".containerd.runtimes\]\n        \[plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata\]\n          runtime_type = "io.containerd.kata.v2"/' /etc/containerd/config.toml
      
      systemctl enable --now containerd
      systemctl restart containerd
      
      containerd --version
      runc --version
      /opt/kata/bin/kata-runtime --version
      aa-status --enabled
